name: Release

on:
  push:
    tags:
      - "v*"

# A release must be able to create/update the GitHub release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

      - name: Verify the release tag matches the package version
        run: |
          uv run python -c "import os, camsim; tag = os.environ['GITHUB_REF_NAME']; expected = 'v' + camsim.__version__; assert tag == expected, f'tag {tag!r} does not match package version {expected!r}'; print('tag matches', tag)"

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 *.whl *.tar.gz > SHA256SUMS

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  pypi-publish:
    name: Publish to PyPI (trusted publishing)
    needs: release
    runs-on: ubuntu-latest
    # Configure this environment name and the matching trusted publisher in
    # the PyPI project settings (Settings -> Publishing). No long-lived PyPI
    # token is stored in GitHub.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI with OIDC
        run: uv publish --trusted-publishing always
