site_name: camsim
site_description: Deterministic camera sensor and ISP simulation with image-quality metrics.
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - ISP stages: isp_stages.md
  - Metrics: metrics.md
  - Validation: validation.md
  - Datasheet mapping: datasheet_mapping.md
  - API reference: api.md
  - Release process: release.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            filters: ["!^_"]
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            show_if_no_docstring: false

# Process material and the superseded reference plan stay in the repository for
# provenance but are not published as part of the documentation site.
exclude_docs: |
  reference/
  superpowers/

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
